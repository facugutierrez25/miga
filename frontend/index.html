<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" href="/src/assets/fonts/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=brand-forest-v1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=brand-forest-v1" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest?v=brand-forest-v1" />
    <!-- Al agregarla al inicio del celular se abre como app (pantalla completa) con nombre "Miga" -->
    <meta name="apple-mobile-web-app-title" content="Miga" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- viewport-fit=cover: el viewport cubre toda la pantalla (notch / Dynamic Island) -->
    <!-- env(safe-area-inset-*) disponible para que el layout empuje el contenido a zona segura -->
    <!-- theme-color coincide con --bg para que la status bar no contraste con el fondo -->
    <meta name="theme-color" content="#F2F1EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Miga</title>
  </head>
  <body>
    <script>
      (function () {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
          // Reemplaza los theme-color con media por uno fijo que coincida con --bg del tema elegido
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.remove() })
          var m = document.createElement('meta')
          m.name = 'theme-color'
          m.content = t === 'dark' ? '#121212' : '#F2F1EA'
          document.head.appendChild(m)
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
