# Testcontainers levanta un PostgreSQL real y descartable para cada corrida de tests.
spring:
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///miga
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

app:
  rate-limit:
    enabled: false
  # Los tests procesan los emails llamando a processJobs(); sin esto, los procesadores
  # programados de otros contextos de Spring podían tomar el email de un test.
  email-outbox:
    scheduler-enabled: false
