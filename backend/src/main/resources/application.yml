# Toda la configuración sensible o que cambia por entorno viene de variables de entorno.
# Los valores por defecto sirven para desarrollo local con docker compose.
spring:
  application:
    name: miga-backend
  config:
    # Carga .env de la raíz del proyecto cuando se corre con Maven local.
    # En Docker no existe esa ruta y Spring lo ignora (optional:).
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nutriplan}
    username: ${DB_USER:nutriplan}
    password: ${DB_PASSWORD:nutriplan}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo maneja Flyway; Hibernate solo valida que las entidades coincidan.
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  version: '@project.version@'
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@miga.uy}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MIN:20}
    register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:20}
    resend-per-hour: ${RATE_LIMIT_RESEND_PER_HOUR:5}

jwt:
  secret: ${JWT_SECRET:dev-secret-local-must-be-at-least-32-chars}

resend:
  api-key: ${RESEND_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
