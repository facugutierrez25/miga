# Toda la configuración sensible o que cambia por entorno viene de variables de entorno.
# Los valores por defecto sirven para desarrollo local con docker compose.
spring:
  application:
    name: miga-backend
  config:
    # Carga .env de la raíz del proyecto cuando se corre con Maven local.
    # En Docker no existe esa ruta y Spring lo ignora (optional:).
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nutriplan}
    username: ${DB_USER:nutriplan}
    password: ${DB_PASSWORD:nutriplan}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo maneja Flyway; Hibernate solo valida que las entidades coincidan.
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  version: '@project.version@'
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@miga.uy}
    # Solo perfil local sin proveedor: muestra en el log el enlace de verificación.
    log-links: ${MAIL_LOG_LINKS:false}
    connect-timeout-ms: ${MAIL_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${MAIL_READ_TIMEOUT_MS:10000}
  email-outbox:
    lease-ms: ${EMAIL_OUTBOX_LEASE_MS:300000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MIN:20}
    register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:20}
    resend-per-hour: ${RATE_LIMIT_RESEND_PER_HOUR:5}
  ops:
    # Clave para /actuator/metrics e /actuator/info (encabezado X-Ops-Key). Vacía = sin acceso.
    api-key: ${OPS_API_KEY:}

jwt:
  secret: ${JWT_SECRET:dev-secret-local-must-be-at-least-32-chars}

resend:
  api-key: ${RESEND_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
    info:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: '@project.name@'
    version: '@project.version@'
    description: '@project.description@'

logging:
  pattern:
    # Cada línea lleva el correlationId de la petición (vacío fuera de una petición HTTP).
    level: "%5p [correlationId=%X{correlationId:-}]"
