# Entorno local completo.
#   Solo la base:          docker compose up -d db
#   Base + backend:        docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-miga}
      POSTGRES_USER: ${DB_USER:-miga}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-miga}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-miga} -d ${DB_NAME:-miga}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-miga}
      DB_USER: ${DB_USER:-miga}
      DB_PASSWORD: ${DB_PASSWORD:-miga}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      # Nunca el secreto de desarrollo, que es público: sin JWT_SECRET en .env el backend no arranca.
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
